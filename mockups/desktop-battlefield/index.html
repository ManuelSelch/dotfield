<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Dotfield — Responsive battlefield preview</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="safe-area">
    <div class="stage">
      <section class="game" aria-label="Responsive battlefield preview">
        <header><h1><span aria-hidden="true"></span>dotfield</h1></header>
        <div class="toolbar">
          <div class="composition" role="img" aria-label="Example troop composition"><i></i><i></i><i></i></div>
          <button id="pause" aria-label="Pause" title="Pause"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg></button>
        </div>
        <div class="field">
          <svg id="board" viewBox="0 0 360 480" role="img" aria-label="Static 13-city battlefield"></svg>
          <div class="overlay" id="overlay" hidden>
            <section role="dialog" aria-modal="true" aria-labelledby="pause-title"><h2 id="pause-title">Paused</h2><button id="resume">Resume</button><button id="restart">Restart</button><p>Layout preview only</p></section>
          </div>
        </div>
      </section>
    </div>
  </main>
  <script type="module" src="./main.js"></script>
</body>
</html>
