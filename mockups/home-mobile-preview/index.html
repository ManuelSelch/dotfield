<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dotfield mobile Home layout</title><link rel="stylesheet" href="./styles.css"></head>
<body><main class="app">
<header class="topbar"><a class="brand" href="#"><i></i> dotfield</a></header>
<div class="layout">
<aside class="settings desktop-settings" aria-label="Match settings">
<div class="section-title">Your match</div><div class="setting"><b>Cities</b><div class="stepper"><button aria-label="Fewer cities">−</button><output>14</output><button aria-label="More cities">+</button></div></div><input aria-label="Total cities" type="range" min="6" max="24" value="14"><div class="range"><span>6</span><span>24</span></div>
<div class="setting enemy-row"><b>Enemies</b><div class="segments"><button>1</button><button class="selected">2</button><button>3</button><button>4</button></div></div>
<div class="section-title divider">On the field</div><div class="pills"><button class="pill active">Factory</button><button class="pill active">River &amp; bridges</button><button class="pill active">Mountains</button><button class="pill">Artillery</button><button class="pill">Watchtower</button><button class="pill">Slow Zone</button></div>
</aside>
<section class="preview" aria-label="Map preview"><div class="map-shell"><svg viewBox="0 0 360 480" role="img" aria-label="Illustrative generated map preview"><path d="M0 195Q90 175 180 200T360 188v57q-90 22-180-1T0 255z" fill="#c5d9d5"/><path d="m144 210 14-38 21 10 24-29 26 10 25 40-17 21-26-7-23 15-23-11z" fill="#aeb9a8"/><g fill="#267c72"><circle cx="52" cy="78" r="19"/><circle cx="283" cy="72" r="19"/><circle cx="54" cy="395" r="19"/><circle cx="301" cy="395" r="19"/></g><g fill="#bd624e"><circle cx="158" cy="105" r="19"/><circle cx="208" cy="366" r="19"/><circle cx="309" cy="178" r="19"/></g><g fill="#88958b"><circle cx="87" cy="177" r="14"/><circle cx="258" cy="297" r="14"/><circle cx="101" cy="314" r="14"/></g><g fill="white" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="600"><text x="52" y="82">36</text><text x="283" y="76">36</text><text x="54" y="399">36</text><text x="301" y="399">36</text><text x="158" y="109">8</text><text x="208" y="370">8</text><text x="309" y="182">8</text></g><path d="M166 224h34" stroke="white" stroke-width="6" stroke-linecap="round"/></svg></div></section>
</div>
<details class="mobile-settings"><summary>Customize match</summary><div class="settings-inline"><div class="setting"><b>Cities</b><div class="stepper"><button aria-label="Fewer cities">−</button><output>14</output><button aria-label="More cities">+</button></div></div><input aria-label="Total cities" type="range" min="6" max="24" value="14"><div class="range"><span>6</span><span>24</span></div><div class="setting enemy-row"><b>Enemies</b><div class="segments"><button>1</button><button class="selected">2</button><button>3</button><button>4</button></div></div><div class="section-title divider">On the field</div><div class="pills"><button class="pill active">Factory</button><button class="pill active">River &amp; bridges</button><button class="pill active">Mountains</button><button class="pill">Artillery</button><button class="pill">Watchtower</button><button class="pill">Slow Zone</button></div><details><summary>Your upgrades</summary><div class="pills"><button class="pill">Industry</button><button class="pill">Capture shield</button></div></details><details><summary>Enemy settings</summary><p>Behavior: Balanced</p><div class="pills"><button class="pill">Industry</button><button class="pill">Capture shield</button></div></details></div></details>
<footer class="actions"><button class="reroll">↻ Reroll</button><button class="play">Play <span>↗</span></button></footer>
<script src="./main.js"></script></main></body></html>
