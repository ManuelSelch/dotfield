<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dotfield upgrade cards</title><link rel="stylesheet" href="./styles.css"></head>
<body><main class="app"><header><span class="brand"><i></i> dotfield</span><span class="prototype">Home settings concept</span></header><section class="panel"><div class="section-head"><div><h1>Your upgrades</h1><p>Choose bonuses for your faction.</p></div><span class="summary">1 enabled</span></div><div class="cards" role="group" aria-label="Your upgrades">
<button class="upgrade selected" aria-pressed="true"><span class="name">Industry</span><span class="description">+25% production</span></button>
<button class="upgrade" aria-pressed="false"><span class="name">Capture shield</span><span class="description">New captures block 3 hostile batches</span></button>
</div></section><section class="panel enemy"><div class="section-head"><div><h2>Enemy 1</h2><p>Enemy upgrades</p></div><span class="summary">None</span></div><div class="cards" role="group" aria-label="Enemy 1 upgrades"><button class="upgrade" aria-pressed="false"><span class="name">Capture shield</span><span class="description">New captures block 3 hostile batches</span></button></div></section><footer>Explanatory benefit stays visible; qualification notes are omitted.</footer></main><script src="./main.js"></script></body></html>
