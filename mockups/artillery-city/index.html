<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dotfield · Artillery review</title><link rel="stylesheet" href="./styles.css"></head>
<body><main class="app"><header><h1><span></span>Dotfield <small>Artillery</small></h1><button id="pause" class="pause" aria-label="Pause preview">Ⅱ</button></header>
