sonar.projectName=Dotfield
sonar.sourceEncoding=UTF-8
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Keep CLI's default base-directory scope; exclude tests, prototypes, generated
# output and vendored Blockly assets instead of setting sources/tests explicitly.
# Excluded test files still contribute coverage for production source.
sonar.exclusions=**/node_modules/**,dist/**,coverage/**,test-results/**,playwright-report/**,.scannerwork/**,mockups/**,tests/**,**/*.test.ts,**/*.d.ts,src/**/fixtures/**,public/blockly-media/**,public/licenses/**
sonar.coverage.exclusions=*.config.ts
