prepare:
  command: [npm, ci]
  cwd: .
  timeoutSeconds: 300
suites:
  lint:
    command: [npm, run, lint]
    cwd: .
    timeoutSeconds: 120
    auto: after-agent
  typecheck:
    command: [npm, run, typecheck]
    cwd: .
    timeoutSeconds: 120
    auto: after-agent
  format:
    command: [npm, run, format:check]
    cwd: .
    timeoutSeconds: 120
    auto: after-agent
  tooling:
    command: [npm, run, test:tooling]
    cwd: .
    timeoutSeconds: 120
    auto: after-agent
  build:
    command: [npm, run, build]
    cwd: .
    timeoutSeconds: 120
    auto: after-agent
  unit:
    command: [npm, test]
    cwd: .
    timeoutSeconds: 120
    auto: after-agent
  browser:
    command: [npm, run, test:browser]
    cwd: .
    timeoutSeconds: 300
    auto: manual
  pwa:
    command: [npm, run, test:pwa]
    cwd: .
    timeoutSeconds: 300
    auto: manual
